[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merox"
version = "0.1.0"
description = "Oxidized-like Meraki Dashboard configuration backup to Git"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Borealis" }]
keywords = ["meraki", "oxidized", "backup", "git", "network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "meraki>=1.40.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
merox = "merox.cli:main"

[project.urls]
Homepage = "https://github.com/paleophyte/merox"
Issues = "https://github.com/paleophyte/merox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
